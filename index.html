<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteShare - Portal Catatan & Bank Soal</title>
    <link rel="stylesheet" href="style.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <i data-lucide="book-open-check"></i>
                <h1>NoteShare</h1>
            </div>
            <p>Portal Berbagi Catatan & Materi Belajar Siswa</p>
        </header>

        <!-- Main Grid Layout -->
        <div class="main-grid">
            <!-- Form Input Catatan -->
            <div class="card shadow">
                <h2>Tambah Catatan Baru</h2>
                <form id="form-catatan" onsubmit="tambahCatatan(event)" class="form-stack mt-15">
                    <div class="form-group">
                        <label for="judul">Judul Catatan / Materi</label>
                        <input type="text" id="judul" required placeholder="Contoh: Rumus Turunan Matematika">
                    </div>
                    <div class="form-group">
                        <label for="pelajaran">Mata Pelajaran</label>
                        <select id="pelajaran" required>
                            <option value="Matematika">Matematika</option>
                            <option value="Bahasa Indonesia">Bahasa Indonesia</option>
                            <option value="Bahasa Inggris">Bahasa Inggris</option>
                            <option value="IPA / Sains">IPA / Sains</option>
                            <option value="Sejarah">Sejarah</option>
                            <option value="Lainnya">Lainnya</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="penulis">Nama Pembuat / Penulis</label>
                        <input type="text" id="penulis" required placeholder="Contoh: Siska 10 IPA">
                    </div>
                    <div class="form-group">
                        <label for="isi">Isi Catatan / Ringkasan</label>
                        <textarea id="isi" rows="4" required placeholder="Tulis ringkasan atau poin penting di sini..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i data-lucide="plus-circle"></i> Unggah Catatan
                    </button>
                </form>
            </div>

            <!-- Daftar Catatan -->
            <div class="card shadow">
                <div class="card-header">
                    <h2>Daftar Catatan Kelas</h2>
                    <div class="filter-group">
                        <label>Filter:</label>
                        <select id="filter-mapel" onchange="renderCatatan()">
                            <option value="Semua">Semua Pelajaran</option>
                            <option value="Matematika">Matematika</option>
                            <option value="Bahasa Indonesia">Bahasa Indonesia</option>
                            <option value="Bahasa Inggris">Bahasa Inggris</option>
                            <option value="IPA / Sains">IPA / Sains</option>
                            <option value="Sejarah">Sejarah</option>
                            <option value="Lainnya">Lainnya</option>
                        </select>
                    </div>
                </div>
                
                <div id="catatan-container" class="catatan-list mt-15">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
